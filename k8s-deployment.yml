apiVersion: apps/meta/v1
kind: Deployment
metadata:
  name: hospital-portal-deployment
  labels:
    app: hospital-portal
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hospital-portal
  template:
    metadata:
      labels:
        app: hospital-portal
    spec:
      containers:
      - name: hospital-portal
        # Replace 'your-dockerhub-username' with your real Docker Hub namespace
        image: your-dockerhub-username/hospital-portal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hospital-portal-service
spec:
  type: NodePort
  selector:
    app: hospital-portal
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 32080
